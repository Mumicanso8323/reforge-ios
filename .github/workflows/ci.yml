name: ci

# Re:Forge の CI。
#   core: ReForgeCore を Linux で swift test(安くて速い)
#   ios : xcodegen → シミュレータで単体テスト → 未署名 ipa を作る → (手動起動で release=true なら) プレリリース公開
#   rec: 手動起動で rec=true のときだけ。10 分の通しを録画し、公開鍵(age)で暗号化した成果物だけを上げる(別ジョブ・保持 1 日)
#   testflight: 手動起動で testflight=true・main のときだけ。Release で archive → App Store Connect へ(鍵が無ければ署名なしで archive まで)
#   screens: 手動起動で screens=true のときだけ。公開の層だけのアプリで主な画面を 5 言語で撮り、PNG を artifact に上げる
# ipa は未署名。SideStore が自分の Apple ID で再署名して入れる。

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'ipa を GitHub のプレリリースとして公開する'
        type: boolean
        default: false
      run_app_tests:
        description: 'シミュレータでアプリの単体テストを回す'
        type: boolean
        default: true
      screens:
        description: '画面の写真を撮る(公開の層だけ。PNG を artifact screens に上げる)'
        type: boolean
        default: false
      rec:
        description: '10 分の通しを録画し、公開鍵で暗号化した成果物だけを上げる(別ジョブ)'
        type: boolean
        default: false
      testflight:
        description: 'TestFlight へ上げる(main だけ。Release で archive。鍵が無ければ署名なしで archive まで)'
        type: boolean
        default: false

# 既定は読むだけ。書く(リリースの公開)のは ios ジョブだけが job レベルで足す。
permissions:
  contents: read

concurrency:
  # 手動起動(リリース)が後続の push で取り消されないよう、イベント種別ごとに分ける
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # push・PR は新しい方で取り消す。手動起動(testflight・rec・screens・release)どうしは取り消さない
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  core:
    # 公開の層と非公開の層を別のジョブで並べて回す(1 本で続けて回すと 40 分を越えた。2026-10-02)
    name: ReForgeCore (Linux・${{ matrix.layer }})
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 45  # 150 日の受け入れテストがある
    strategy:
      fail-fast: false
      matrix:
        layer: [public, private]
    env:
      # 非公開のコンテンツ(物語の本文)を読む読み取り専用のデプロイキー(ed25519)。無い(fork の PR など)ときは公開の層だけで回す。
      # secrets は if: に直接書けないので、有無だけを環境変数にする。docs/architecture/E-content.md §4.3
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
      # TEST-R1-02 自動化ボットの走る数(既定 100 は手元と夜間。CI は 20 走)
      REFORGE_R1_02_SEEDS: "20"
      # TEST-O12 地図の保証の種の数(手元の既定は 50。CI は全部の 1000)
      REFORGE_O12_SEEDS: "1000"
      REFORGE_FIRSTFIRE_SEEDS: "200"
    steps:
      - uses: actions/checkout@v5
      # main への push で鍵が無いと非公開の層が丸ごと飛ばされて緑になる。それは失敗にする(手動起動・PR は fork などで鍵が無いことがあるので今のまま)。
      - name: 非公開の層の鍵があること(main への push)
        if: matrix.layer == 'private' && env.HAS_CONTENT_KEY != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "REFORGE_CONTENT_DEPLOY_KEY が無く、非公開の層を回せない"; exit 1
      - name: swift test(公開の層だけ)
        if: matrix.layer == 'public'
        run: swift test --package-path ReForgeCore
      # actions/checkout の ssh-key には ssh が要る(swift のイメージに無いことがある)
      - name: ssh を用意する
        if: matrix.layer == 'private' && env.HAS_CONTENT_KEY == 'true'
        run: command -v ssh || (apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client)
      - name: 非公開のコンテンツを取り込む
        if: matrix.layer == 'private' && env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false
      # 公開リポジトリのログは誰でも読めるので、非公開の層を重ねたテストは出力を出さない。
      # 失敗したときはテストの名前(公開のコード)だけを出す。ログをアーティファクトにも上げない。
      - name: swift test(非公開の層を重ねて・出力は伏せる)
        if: matrix.layer == 'private' && env.HAS_CONTENT_KEY == 'true'
        run: |
          swift test --package-path ReForgeCore > private-test.log 2>&1 && echo "passed" && exit 0
          grep -oE "Test Case '[^']+' failed" private-test.log | sort -u | head -50
          grep -qE "error: (emit|compile|link)" private-test.log && echo "ビルドに失敗(詳細は手元で)"
          exit 1

  # アプリ(ReForge/)は Linux でコンパイルされないので、本体の変更でアプリが壊れても core では気づけない。
  # iOS のジョブより先に静的に確かめる(数秒): switch の網羅と、型の名前の重なり(曖昧な型)。
  app-switches:
    name: アプリの静的な確かめ(switch の網羅・型の名前・物語の語)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: switch の網羅
        run: python3 tools/check-app-switches.py
      - name: 型の名前の重なり
        if: always()
        run: python3 tools/check-app-names.py
      - name: ストアの原稿の置き場
        if: always()
        run: python3 tools/check-store-metadata.py
      - name: 文字列カタログが画面の文言と合っている
        if: always()
        run: python3 tools/gen-xcstrings.py --check
      - name: 公開語の検査器を確かめる
        if: always()
        run: python3 tools/test_check_public_spoilers.py
      # testflight ジョブは app-switches を needs に持つので、ここが落ちると TestFlight へ上げない(門)
      - name: Release の組みに debug の物が入らない
        if: always()
        run: python3 tools/check-release-build.py
      # 公開リポジトリに物語の語が入っていないこと(語は非公開の層の perception/forbidden.json)。
      # 当たった語・文はログに出さず、ファイルと行だけを出す。fork の PR など鍵が無いときは飛ばす。
      - name: 非公開のコンテンツを取り込む(物語の語の一覧のため)
        if: always() && env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false
      - name: 物語の語が公開リポジトリに無いこと
        if: always() && env.HAS_CONTENT_KEY == 'true'
        run: python3 tools/check-public-spoilers.py

  ios:
    name: iOS (テスト + ipa)
    needs: [core, app-switches]
    runs-on: macos-26
    timeout-minutes: 60
    # Pre-release と dev release の公開(gh release create / upload)に要る。他のジョブは読むだけ。
    permissions:
      contents: write
    env:
      VERSION: 0.1.0
      BUILD: ${{ github.run_number }}
      TAG: v0.1.0-b${{ github.run_number }}
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
      # dev の ipa(SideStore で配る releases/download/dev)だけの切り替え。開発の設定の節などを出す。
      # 店に出すビルドのジョブを足すときは、この値を持ち込まない(M-01 の REFORGE_TRIAL_GATE_OPEN と同じ扱い)。
      DEV_IPA_CONDITIONS: REFORGE_DEV
    steps:
      - uses: actions/checkout@v5

      - name: 非公開のコンテンツを取り込む
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false

      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "using $x"
          sudo xcode-select -s "$x"; xcodebuild -version

      # 公開の層の写しと、封をした非公開の層(private.sealed)と鍵の Swift ファイルを作る(E-content.md §4.5)。
      # 非公開の層が無ければ鍵 nil で、公開の層だけのアプリになる。鍵・本文はログに出さない。
      # Xcode を選んだ後・XcodeGen の前に回す(生成する ContentKey.swift と AppContent/ をプロジェクトが拾う)。
      - name: コンテンツの束を作る
        run: tools/content/stage.sh

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: App unit tests (simulator)
        if: github.event_name != 'workflow_dispatch' || inputs.run_app_tests
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $udid"
          xcodebuild test -project ReForge.xcodeproj -scheme ReForge \
            -destination "id=$udid" -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 \
            || {
              if [ "$HAS_CONTENT_KEY" = "true" ]; then
                # 非公開の層を重ねて回した。公開ログに XCTAssert の文面(物語の文が入りうる)を出さない。テストの名前(公開のコード)だけ。
                grep -oE "Test Case '[^']+' failed" test.log | sort -u | head -50 || true
                grep -qE "error: |Undefined symbol" test.log && echo "ビルドかテストにエラー(詳細は手元で)"
              else
                grep -E "error:|failed|Undefined symbol" test.log | sort -u | head -80; tail -40 test.log
              fi
              exit 1
            }
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" test.log | tail -20

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ReForge.xcodeproj -scheme ReForge \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$DEV_IPA_CONDITIONS" \
            build > build.log 2>&1 \
            || { grep -B2 -A8 "error:" build.log | head -200; tail -60 build.log; exit 1; }
          grep -E "\*\* BUILD" build.log || true

      # build.log・test.log は成果物に上げない(このジョブは非公開の層を重ねて回すので、記録に物語の文が混ざりうる)

      - name: Package ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReForge.app Payload/
          APP=Payload/ReForge.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleDisplayName" \
            -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.yusukedoi.reforge
          lipo -info "$APP/ReForge"
          # 平文の非公開の層が ipa に入っていないこと。見張りの文字列(値はログに出さない)が平文で現れないこと
          test ! -e "$APP/content/private" || { echo "平文の非公開の層が ipa に入っている"; exit 1; }
          # 非公開の絵(content/private/art)の中身そのものが ipa に入っていないこと(ハッシュで突き合わせる。名前は出さない)
          if [ -d content/private/art ]; then
            find content/private/art -type f -exec shasum -a 256 {} + | awk '{print $1}' | sort -u > private-art.sha
            find Payload -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec shasum -a 256 {} + \
              | awk '{print $1}' | sort -u > payload-art.sha
            if [ -n "$(comm -12 private-art.sha payload-art.sha)" ]; then
              echo "非公開の絵が ipa に平文で入っている"; exit 1
            fi
          fi
          if [ -f content/private/bundle.json ]; then
            canary=$(python3 -c 'import json; print(json.load(open("content/private/bundle.json"))["bundle"].get("canary") or "")')
            if [ -n "$canary" ] && grep -rqF -- "$canary" Payload; then
              echo "見張りの文字列が ipa の中に平文で見つかった(封が効いていない)"; exit 1
            fi
          fi
          zip -qry ReForge.ipa Payload
          ls -la ReForge.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: ReForge-${{ env.VERSION }}-${{ env.BUILD }}
          path: ReForge.ipa
          retention-days: 14

      - name: Pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" ReForge.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Re:Forge $VERSION (build $BUILD)" \
            --notes "開発版の未署名 ipa。SideStore で読み込むと自分の Apple ID で署名して入ります。" \
            --prerelease

      # 更新ショートカット用の固定 URL(releases/download/dev/ReForge.ipa)。毎回ここを最新版で上書きする
      - name: Update fixed "dev" release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create dev --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Re:Forge 最新の開発版" --notes "更新ショートカット用。常に最新のプレリリースと同じ ipa。" --prerelease
          gh release upload dev ReForge.ipa --repo "${{ github.repository }}" --clobber

  # 画面の写真(docs/briefs/screen-snapshots.md)。公開リポジトリの artifact は誰でも見られるので、撮るのは公開の層だけ。
  # 非公開のコンテンツ(reforge-content)も REFORGE_CONTENT_DEPLOY_KEY もこのジョブでは使わない。
  # 手動起動で screens=true のときだけ回す(main への push では回さない)。core と app-switches は手動起動でも回るので、needs で飛ばされない。
  screens:
    name: 画面の写真(公開の層・5 言語)
    if: github.event_name == 'workflow_dispatch' && inputs.screens
    needs: [core, app-switches]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "using $x"
          sudo xcode-select -s "$x"; xcodebuild -version

      # 非公開の層が無いこと(取り込む手順がこのジョブに無いので、あれば何かが紛れている)
      - name: 非公開の層が無いこと
        run: test ! -e content/private || { echo "content/private がある"; exit 1; }

      - name: コンテンツの束を作る(公開の層だけ)
        run: tools/content/stage.sh

      # 束と鍵が公開の層だけであること(アプリの中でも撮る前に UI テストが同じことを確かめる)
      - name: 束に非公開の層・鍵が無いこと
        run: |
          test ! -e AppContent/content/private.sealed || { echo "private.sealed がある"; exit 1; }
          test ! -e AppContent/content/art.sealed || { echo "art.sealed がある"; exit 1; }
          test ! -e AppContent/content/private || { echo "平文の private がある"; exit 1; }
          grep -q 'static let key: Data? = nil' ReForge/Generated/ContentKey.swift || { echo "鍵が nil ではない"; exit 1; }

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate

      # 使える最初の iPhone を 1 機種に固定する(ios ジョブと同じ選び方)。時計は 9:41 に固定する。
      - name: シミュレータを選ぶ
        id: sim
        run: |
          v=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; x=next(x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")); print(x["udid"] + "|" + x["name"])')
          udid="${v%%|*}"; name="${v#*|}"
          echo "simulator $udid ($name)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      # 65 枚(5 言語 × 13 画面)。序の動画のテスト(PrologueVideoTests)は次の step で、録画しながら回す。検査に当たると失敗する。ログは artifact に上げない(公開の層だけだが、小さく保つ)。
      - name: 画面の写真を撮る
        run: |
          set -o pipefail
          rm -rf screens.xcresult
          xcodebuild test -project ReForge.xcodeproj -scheme ReForgeScreens \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build-screens \
            -resultBundlePath screens.xcresult \
            -skip-testing:ReForgeUITests/PrologueVideoTests \
            CODE_SIGNING_ALLOWED=NO > screens-test.log 2>&1 \
            || { grep -E "error:|failed|Undefined symbol" screens-test.log | sort -u | head -80; tail -40 screens-test.log; exit 1; }
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" screens-test.log | tail -20

      # 序の短い動画(PT-B6 §3)。simctl の recordVideo を回したまま、UI テストが序の見本を起動から地図まで送る(案 A・B・C の 3 本)。
      # 動画は試験の見本の文だけを写す(公開の層)。録画が止まる等で撮れなくても、ジョブは落とさない(要約に 1 行出す)。
      # 録画が撮れないのは許す(要約に出すだけ)。テスト(PrologueVideoTests)の失敗は印を残し、最後の step で赤にする。
      - name: 序の動画を撮る(案 A・B・C)
        if: always()
        run: |
          mkdir -p screens-video
          rm -f "$RUNNER_TEMP/video-test-failed"
          for s in A B C; do
            out="screens-video/prologue-$(echo "$s" | tr 'A-Z' 'a-z').mp4"
            xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec=h264 --force "$out" > /dev/null 2>&1 &
            rec=$!
            sleep 3
            xcodebuild test-without-building -project ReForge.xcodeproj -scheme ReForgeScreens \
              -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build-screens \
              -only-testing:ReForgeUITests/PrologueVideoTests/testStyle$s \
              CODE_SIGNING_ALLOWED=NO > "video-$s.log" 2>&1 || {
                echo "動画 $s: テストが落ちた(動画はあれば残す)"
                echo "$s" >> "$RUNNER_TEMP/video-test-failed"
                grep -oE "Test Case '[^']+' failed" "video-$s.log" | sort -u | head -10 || true
              }
            kill -INT "$rec" 2>/dev/null || true
            wait "$rec" 2>/dev/null || true
            if [ -s "$out" ]; then
              echo "動画 $s: 撮れた($(stat -f%z "$out") バイト)"
            else
              echo "動画 $s: 撮れなかった(ランナーで録画が止まった)"
              echo "序の動画 $s: 撮れなかった(ジョブは落とさない)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # xcresult の添付を PNG と report.json に出す(Xcode 16 以降の xcresulttool export attachments)。失敗しても出す。
      - name: 添付を取り出す
        if: always()
        run: |
          rm -rf screens-raw screens
          if [ -d screens.xcresult ]; then
            xcrun xcresulttool export attachments --path screens.xcresult --output-path screens-raw
          fi
          mkdir -p screens-raw screens
          python3 tools/collect-screens.py screens-raw screens --device "${{ steps.sim.outputs.name }}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens
          path: |
            screens/*.png
            screens/report.json
            screens-video/*.mp4
          if-no-files-found: warn
          retention-days: 14

      # 序の動画のテストが落ちていたら赤にする(録画だけの失敗は上の step で許している)
      - name: 序の動画のテストの結果
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/video-test-failed" ]; then
            echo "序の動画のテストが落ちた(案: $(tr '\n' ' ' < "$RUNNER_TEMP/video-test-failed"))"; exit 1
          fi

  rec:
    name: 録画(暗号化)
    # 手動起動で rec=true のときだけ回す。screens と ios とは別ジョブ(非公開の層の封は、このジョブの中だけで開く)。
    if: github.event_name == 'workflow_dispatch' && inputs.rec
    needs: [core, app-switches]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
      # age の受け手(公開鍵。Repository variable REC_AGE_RECIPIENT)。秘密鍵は hub の ~/.config/reforge-rec/key.txt だけにある。
      REC_RECIPIENT: ${{ vars.REC_AGE_RECIPIENT }}
    steps:
      - name: 公開鍵があること
        run: test -n "$REC_RECIPIENT" || { echo "暗号化の公開鍵が無い。録画しない"; exit 1; }

      - uses: actions/checkout@v5

      - name: 非公開のコンテンツを取り込む
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false

      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$x"

      # 10 分のボット(ReForgeCore の受け入れテスト)を回して、送った命令の台本(時刻つき)を書く。
      # 出力は全部ファイルへ(ボットの記録には内容の名前が出るので、ログにも成果物にも出さない)。長さだけを出す。
      - name: 通しの台本を作る
        timeout-minutes: 25
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/rec"
          REFORGE_PRIVATE_CONTENT="$PWD/content/private" REFORGE_TENMIN_BOT=1 REFORGE_TENMIN_SEEDS=1 \
          REFORGE_TENMIN_SCRIPT="$RUNNER_TEMP/rec/play.json" \
            swift test --package-path ReForgeCore --filter FirstTenMinutesBotTests/testFirstTenMinutesTimeline > "$RUNNER_TEMP/rec/bot.log" 2>&1 \
            || { echo "台本の作成に失敗(詳細は成果物に出さない)"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('commands', len(d['commands']), 'seconds', d['seconds'])" "$RUNNER_TEMP/rec/play.json"

      - name: コンテンツの束を作る
        run: tools/content/stage.sh

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      - name: アプリを組む(シミュレータ用)
        run: |
          set +x
          xcodebuild build -project ReForge.xcodeproj -scheme ReForge -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/rec/dd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/rec/build.log" 2>&1 \
            || { grep -c "error:" "$RUNNER_TEMP/rec/build.log"; echo "組むのに失敗(詳細は出さない)"; exit 1; }

      # 台本を流し込む起動(-ReForgeReplay。DEBUG の組みだけ)。シミュレータのアプリは host のファイルを読めるので、台本は $RUNNER_TEMP のまま渡す。
      - name: 録る
        run: |
          set +x
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b >/dev/null
          app="$RUNNER_TEMP/rec/dd/Build/Products/Debug-iphonesimulator/ReForge.app"
          xcrun simctl install "$udid" "$app"
          xcrun simctl io "$udid" recordVideo --codec h264 --force "$RUNNER_TEMP/rec/rec.mp4" &
          rec_pid=$!
          sleep 3
          xcrun simctl launch "$udid" com.yusukedoi.reforge -ReForgeReplay "$RUNNER_TEMP/rec/play.json" -ReForgeReplayDone "$RUNNER_TEMP/rec/done" -AppleLanguages "(ja)" >/dev/null
          # 台本が終わると、アプリが done ファイルを書く(最大 15 分待つ)
          for i in $(seq 1 450); do test -e "$RUNNER_TEMP/rec/done" && break; sleep 2; done
          if test -e "$RUNNER_TEMP/rec/done"; then echo "台本の結果: $(head -c 40 "$RUNNER_TEMP/rec/done")"; else echo "台本の結果: 終わらなかった"; fi
          sleep 3
          kill -INT "$rec_pid"; wait "$rec_pid" || true
          xcrun simctl shutdown "$udid" || true
          ls -l "$RUNNER_TEMP/rec/rec.mp4" | awk '{print "録画のバイト数", $5}'

      # 暗号化。成果物は暗号文だけ。平文の動画・台本・ログは暗号化の直後に消す(消せなくてもこのジョブの後に runner ごと消える)。
      - name: 暗号化する
        run: |
          set +x
          command -v age || brew install age
          age -r "$REC_RECIPIENT" -o "$RUNNER_TEMP/rec/rec.mp4.age" "$RUNNER_TEMP/rec/rec.mp4"
          ls -l "$RUNNER_TEMP/rec/rec.mp4.age" | awk '{print "暗号文のバイト数", $5}'
          rm -f "$RUNNER_TEMP/rec/rec.mp4" "$RUNNER_TEMP/rec/play.json" "$RUNNER_TEMP/rec/bot.log" "$RUNNER_TEMP/rec/build.log" "$RUNNER_TEMP/rec/done"
          test ! -e "$RUNNER_TEMP/rec/rec.mp4"

      - uses: actions/upload-artifact@v5
        with:
          name: rec-${{ github.run_number }}
          path: ${{ runner.temp }}/rec/rec.mp4.age
          retention-days: 1
          if-no-files-found: error

  # TestFlight(docs: testflight-plan TF-T1)。手動起動で testflight=true、かつ main のときだけ回す。
  # Release で archive → exportArchive(app-store-connect・upload)。ios・screens・rec とは独立(needs は core と app-switches だけ)。
  # 認証は App Store Connect の API キー(secrets: ASC_KEY_ID・ASC_ISSUER_ID・ASC_KEY_P8)と、チーム ID(secrets: APPLE_TEAM_ID)。
  # どれかが無い間は、署名なしで archive まで通して止める(試し。成功で終わり、送らない)。
  # このジョブは開発の切り替え(SWIFT_ACTIVE_COMPILATION_CONDITIONS・REFORGE_DEV)を持ち込まない(tools/check-release-build.py が見張る。app-switches ジョブで回り、このジョブの門になる)。
  # 公開リポジトリのログは誰でも読めるので、鍵・ID の値は出さない。xcodebuild の出力は一度ファイルへ落とし、error 行だけを出す。
  testflight:
    name: TestFlight (Release archive・上げる)
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && github.ref == 'refs/heads/main'
    needs: [core, app-switches]
    runs-on: macos-26
    timeout-minutes: 60
    # 鍵(ASC_*・APPLE_TEAM_ID)は GitHub の Environment「testflight」(main だけ)に置く。リポジトリ全体の secrets には置かない
    environment: testflight
    # 上げる処理は並べない(取り消しもしない。取り消すと途中の送信が半端になる)
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      VERSION: 0.1.0
      # BUILD(CFBundleVersion)は最初の step で決める(run 番号 + 再実行の回数 2 桁。数値のみ・単調増加)
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
      # 鍵とチーム ID が全部そろっているか(値は出さない。有無だけ)
      CAN_UPLOAD: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      # project.yml の DEVELOPMENT_TEAM($(REFORGE_TEAM_ID))と ExportOptions の teamID が読む
      REFORGE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: 保存の形が凍結されていること
        run: |
          grep -qE 'compatibilityFrozen *(: *Bool)? *= *true' ReForgeCore/Sources/RFSave/SaveCodec.swift \
            || { echo "保存の形を凍結してから出す(SaveCodec.compatibilityFrozen を true に)"; exit 1; }

      # 同じ run の再実行(run_attempt が増える)でも App Store Connect に弾かれないよう、BUILD を一意にする。
      # 例: run 123・1 回目 → 12301、再実行 → 12302。以後の step は $BUILD を読む。
      - name: BUILD を決める
        run: |
          build=$(printf '%d%02d' "${{ github.run_number }}" "${{ github.run_attempt }}")
          echo "BUILD=$build" >> "$GITHUB_ENV"
          echo "build $build"

      - name: 非公開のコンテンツを取り込む
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false

      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "using $x"
          sudo xcode-select -s "$x"; xcodebuild -version

      - name: コンテンツの束を作る
        run: tools/content/stage.sh

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      # API キー(.p8)を一時ファイルに書く(権限 600)。ジョブの最後(always)に消す。set +x で値をログに出さない。
      - name: API キーを置く
        if: env.CAN_UPLOAD == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          test -s "$RUNNER_TEMP/asc/AuthKey.p8" || { echo "API キーが空"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          echo "API キーを置いた(値は出さない)"

      - name: Archive (Release)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          log="$RUNNER_TEMP/archive.log"
          if [ "$CAN_UPLOAD" = "true" ]; then
            echo "署名して archive する(自動署名・API キー)"
            xcodebuild archive -project ReForge.xcodeproj -scheme ReForge \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/ReForge.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" > "$log" 2>&1 \
              || { grep -E "error:" "$log" | sort -u | head -40; echo "archive に失敗"; exit 1; }
          else
            echo "鍵かチーム ID が無いので、署名なしで archive だけ通す(試し)"
            xcodebuild archive -project ReForge.xcodeproj -scheme ReForge \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/ReForge.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" > "$log" 2>&1 \
              || { grep -E "error:" "$log" | sort -u | head -40; echo "archive に失敗"; exit 1; }
          fi
          grep -E "\*\* ARCHIVE" "$log" || true

      # archive の中の .app を調べる。非公開の層の封(ios ジョブの ipa の段と同じ検査)と、debug 専用の物が入っていないこと。
      - name: archive の中身を確かめる
        run: |
          set +x
          APP=build/ReForge.xcarchive/Products/Applications/ReForge.app
          test -d "$APP" || { echo ".app が archive に無い"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.yusukedoi.reforge
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD" || { echo "CFBundleVersion が BUILD と違う"; exit 1; }
          lipo -info "$APP/ReForge"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "PrivacyInfo.xcprivacy が .app に無い"; exit 1; }

          # 平文の非公開の層が入っていないこと。見張りの文字列(値はログに出さない)が平文で現れないこと
          test ! -e "$APP/content/private" || { echo "平文の非公開の層が .app に入っている"; exit 1; }
          if [ -d content/private/art ]; then
            find content/private/art -type f -exec shasum -a 256 {} + | awk '{print $1}' | sort -u > private-art.sha
            find "$APP" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec shasum -a 256 {} + \
              | awk '{print $1}' | sort -u > payload-art.sha
            if [ -n "$(comm -12 private-art.sha payload-art.sha)" ]; then
              echo "非公開の絵が .app に平文で入っている"; exit 1
            fi
          fi
          if [ -f content/private/bundle.json ]; then
            canary=$(python3 -c 'import json; print(json.load(open("content/private/bundle.json"))["bundle"].get("canary") or "")')
            if [ -n "$canary" ] && grep -rqF -- "$canary" "$APP"; then
              echo "見張りの文字列が .app の中に平文で見つかった(封が効いていない)"; exit 1
            fi
          fi

          # debug 専用の文字列(台本の流し込み・撮影の起動引数)が、組んだバイナリに無いこと
          strings -a "$APP/ReForge" > "$RUNNER_TEMP/app.strings"
          if grep -qE "ReForgeReplay|ReForgeScreenshot" "$RUNNER_TEMP/app.strings"; then
            grep -oE "ReForgeReplay[A-Za-z]*|ReForgeScreenshot[A-Za-z]*" "$RUNNER_TEMP/app.strings" | sort -u
            echo "debug 専用の文字列が Release のバイナリに入っている"; exit 1
          fi
          echo "archive の中身の確かめは通った"

      - name: App Store Connect へ上げる
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          if [ "$CAN_UPLOAD" != "true" ]; then
            echo "鍵が無いので送らない(archive まで通した)"
            exit 0
          fi
          log="$RUNNER_TEMP/export.log"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${REFORGE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ReForge.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$log" 2>&1 \
            || { grep -E "error:" "$log" | sort -u | head -40; echo "上げるのに失敗"; exit 1; }
          grep -E "\*\* EXPORT" "$log" || true
          echo "App Store Connect へ上げた(build $BUILD)"

      - name: API キーを消す
        if: always()
        run: |
          set +x
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" "$RUNNER_TEMP/app.strings"
          echo "一時ファイルを消した"
