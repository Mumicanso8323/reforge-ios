name: ci

# Re:Forge の CI。
#   core: ReForgeCore を Linux で swift test(安くて速い)
#   ios : xcodegen → シミュレータで単体テスト → 未署名 ipa を作る → (手動起動で release=true なら) プレリリース公開
#   screens: 手動起動で screens=true のときだけ。公開の層だけのアプリで主な画面を 5 言語で撮り、PNG を artifact に上げる
#            (docs/briefs/screen-snapshots.md。非公開の層は取り込まない)
# ipa は未署名。SideStore が自分の Apple ID で再署名して入れる。

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'ipa を GitHub のプレリリースとして公開する'
        type: boolean
        default: false
      run_app_tests:
        description: 'シミュレータでアプリの単体テストを回す'
        type: boolean
        default: true
      screens:
        description: '画面の写真を撮る(公開の層だけ。PNG を artifact screens に上げる)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 手動起動(リリース)が後続の push で取り消されないよう、イベント種別ごとに分ける
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    name: ReForgeCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 40  # 公開の層と非公開の層の 2 回。150 日の受け入れテストがある
    env:
      # 非公開のコンテンツ(物語の本文)を読む読み取り専用のデプロイキー(ed25519)。無い(fork の PR など)ときは公開の層だけで回す。
      # secrets は if: に直接書けないので、有無だけを環境変数にする。docs/architecture/E-content.md §4.3
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
      # TEST-R1-02 自動化ボットの走る数(既定 100 は手元と夜間。CI は 20 走)
      REFORGE_R1_02_SEEDS: "20"
    steps:
      - uses: actions/checkout@v5
      - name: swift test(公開の層だけ)
        run: swift test --package-path ReForgeCore
      # actions/checkout の ssh-key には ssh が要る(swift のイメージに無いことがある)
      - name: ssh を用意する
        if: env.HAS_CONTENT_KEY == 'true'
        run: command -v ssh || (apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client)
      - name: 非公開のコンテンツを取り込む
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false
      # 公開リポジトリのログは誰でも読めるので、非公開の層を重ねたテストは出力を出さない。
      # 失敗したときはテストの名前(公開のコード)だけを出す。ログをアーティファクトにも上げない。
      - name: swift test(非公開の層を重ねて・出力は伏せる)
        if: env.HAS_CONTENT_KEY == 'true'
        run: |
          swift test --package-path ReForgeCore > private-test.log 2>&1 && echo "passed" && exit 0
          grep -oE "Test Case '[^']+' failed" private-test.log | sort -u | head -50
          grep -qE "error: (emit|compile|link)" private-test.log && echo "ビルドに失敗(詳細は手元で)"
          exit 1

  # アプリ(ReForge/)は Linux でコンパイルされないので、本体の変更でアプリが壊れても core では気づけない。
  # iOS のジョブより先に静的に確かめる(数秒): switch の網羅と、型の名前の重なり(曖昧な型)。
  app-switches:
    name: アプリの静的な確かめ(switch の網羅・型の名前・物語の語)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: switch の網羅
        run: python3 tools/check-app-switches.py
      - name: 型の名前の重なり
        if: always()
        run: python3 tools/check-app-names.py
      - name: 文字列カタログが画面の文言と合っている
        if: always()
        run: python3 tools/gen-xcstrings.py --check
      # 公開リポジトリに物語の語が入っていないこと(語は非公開の層の perception/forbidden.json)。
      # 当たった語・文はログに出さず、ファイルと行だけを出す。fork の PR など鍵が無いときは飛ばす。
      - name: 非公開のコンテンツを取り込む(物語の語の一覧のため)
        if: always() && env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false
      - name: 物語の語が公開リポジトリに無いこと
        if: always() && env.HAS_CONTENT_KEY == 'true'
        run: python3 tools/check-public-spoilers.py

  ios:
    name: iOS (テスト + ipa)
    needs: [core, app-switches]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: 0.1.0
      BUILD: ${{ github.run_number }}
      TAG: v0.1.0-b${{ github.run_number }}
      HAS_CONTENT_KEY: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: 非公開のコンテンツを取り込む
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v5
        with:
          repository: Mumicanso8323/reforge-content
          ssh-key: ${{ secrets.REFORGE_CONTENT_DEPLOY_KEY }}
          path: content/private
          persist-credentials: false

      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "using $x"
          sudo xcode-select -s "$x"; xcodebuild -version

      # 公開の層の写しと、封をした非公開の層(private.sealed)と鍵の Swift ファイルを作る(E-content.md §4.5)。
      # 非公開の層が無ければ鍵 nil で、公開の層だけのアプリになる。鍵・本文はログに出さない。
      # Xcode を選んだ後・XcodeGen の前に回す(生成する ContentKey.swift と AppContent/ をプロジェクトが拾う)。
      - name: コンテンツの束を作る
        run: tools/content/stage.sh

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: App unit tests (simulator)
        if: github.event_name != 'workflow_dispatch' || inputs.run_app_tests
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $udid"
          xcodebuild test -project ReForge.xcodeproj -scheme ReForge \
            -destination "id=$udid" -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 \
            || { grep -E "error:|failed|Undefined symbol" test.log | sort -u | head -80; tail -40 test.log; exit 1; }
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" test.log | tail -20

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ReForge.xcodeproj -scheme ReForge \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            build > build.log 2>&1 \
            || { grep -B2 -A8 "error:" build.log | head -200; tail -60 build.log; exit 1; }
          grep -E "\*\* BUILD" build.log || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

      - name: Package ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReForge.app Payload/
          APP=Payload/ReForge.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleDisplayName" \
            -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.yusukedoi.reforge
          lipo -info "$APP/ReForge"
          # 平文の非公開の層が ipa に入っていないこと。見張りの文字列(値はログに出さない)が平文で現れないこと
          test ! -e "$APP/content/private" || { echo "平文の非公開の層が ipa に入っている"; exit 1; }
          # 非公開の絵(content/private/art)の中身そのものが ipa に入っていないこと(ハッシュで突き合わせる。名前は出さない)
          if [ -d content/private/art ]; then
            find content/private/art -type f -exec shasum -a 256 {} + | awk '{print $1}' | sort -u > private-art.sha
            find Payload -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec shasum -a 256 {} + \
              | awk '{print $1}' | sort -u > payload-art.sha
            if [ -n "$(comm -12 private-art.sha payload-art.sha)" ]; then
              echo "非公開の絵が ipa に平文で入っている"; exit 1
            fi
          fi
          if [ -f content/private/bundle.json ]; then
            canary=$(python3 -c 'import json; print(json.load(open("content/private/bundle.json"))["bundle"].get("canary") or "")')
            if [ -n "$canary" ] && grep -rqF -- "$canary" Payload; then
              echo "見張りの文字列が ipa の中に平文で見つかった(封が効いていない)"; exit 1
            fi
          fi
          zip -qry ReForge.ipa Payload
          ls -la ReForge.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: ReForge-${{ env.VERSION }}-${{ env.BUILD }}
          path: ReForge.ipa
          retention-days: 14

      - name: Pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" ReForge.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Re:Forge $VERSION (build $BUILD)" \
            --notes "開発版の未署名 ipa。SideStore で読み込むと自分の Apple ID で署名して入ります。" \
            --prerelease

      # 更新ショートカット用の固定 URL(releases/download/dev/ReForge.ipa)。毎回ここを最新版で上書きする
      - name: Update fixed "dev" release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create dev --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Re:Forge 最新の開発版" --notes "更新ショートカット用。常に最新のプレリリースと同じ ipa。" --prerelease
          gh release upload dev ReForge.ipa --repo "${{ github.repository }}" --clobber

  # 画面の写真(docs/briefs/screen-snapshots.md)。公開リポジトリの artifact は誰でも見られるので、撮るのは公開の層だけ。
  # 非公開のコンテンツ(reforge-content)も REFORGE_CONTENT_DEPLOY_KEY もこのジョブでは使わない。
  # 手動起動で screens=true のときだけ回す(main への push では回さない)。core と app-switches は手動起動でも回るので、needs で飛ばされない。
  screens:
    name: 画面の写真(公開の層・5 言語)
    if: github.event_name == 'workflow_dispatch' && inputs.screens
    needs: [core, app-switches]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); echo "using $x"
          sudo xcode-select -s "$x"; xcodebuild -version

      # 非公開の層が無いこと(取り込む手順がこのジョブに無いので、あれば何かが紛れている)
      - name: 非公開の層が無いこと
        run: test ! -e content/private || { echo "content/private がある"; exit 1; }

      - name: コンテンツの束を作る(公開の層だけ)
        run: tools/content/stage.sh

      # 束と鍵が公開の層だけであること(アプリの中でも撮る前に UI テストが同じことを確かめる)
      - name: 束に非公開の層・鍵が無いこと
        run: |
          test ! -e AppContent/content/private.sealed || { echo "private.sealed がある"; exit 1; }
          test ! -e AppContent/content/art.sealed || { echo "art.sealed がある"; exit 1; }
          test ! -e AppContent/content/private || { echo "平文の private がある"; exit 1; }
          grep -q 'static let key: Data? = nil' ReForge/Generated/ContentKey.swift || { echo "鍵が nil ではない"; exit 1; }

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate

      # 使える最初の iPhone を 1 機種に固定する(ios ジョブと同じ選び方)。時計は 9:41 に固定する。
      - name: シミュレータを選ぶ
        id: sim
        run: |
          v=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; x=next(x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")); print(x["udid"] + "|" + x["name"])')
          udid="${v%%|*}"; name="${v#*|}"
          echo "simulator $udid ($name)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      # 40 枚(5 言語 × 8 画面)。検査に当たると失敗する。ログは artifact に上げない(公開の層だけだが、小さく保つ)。
      - name: 画面の写真を撮る
        run: |
          set -o pipefail
          rm -rf screens.xcresult
          xcodebuild test -project ReForge.xcodeproj -scheme ReForgeScreens \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build-screens \
            -resultBundlePath screens.xcresult \
            CODE_SIGNING_ALLOWED=NO > screens-test.log 2>&1 \
            || { grep -E "error:|failed|Undefined symbol" screens-test.log | sort -u | head -80; tail -40 screens-test.log; exit 1; }
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" screens-test.log | tail -20

      # xcresult の添付を PNG と report.json に出す(Xcode 16 以降の xcresulttool export attachments)。失敗しても出す。
      - name: 添付を取り出す
        if: always()
        run: |
          rm -rf screens-raw screens
          if [ -d screens.xcresult ]; then
            xcrun xcresulttool export attachments --path screens.xcresult --output-path screens-raw
          fi
          mkdir -p screens-raw screens
          python3 tools/collect-screens.py screens-raw screens --device "${{ steps.sim.outputs.name }}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens
          path: |
            screens/*.png
            screens/report.json
          if-no-files-found: warn
          retention-days: 14
